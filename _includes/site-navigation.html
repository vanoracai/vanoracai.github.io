<nav class="site-nav" aria-label="网站导航">
  <div class="site-nav-inner">
    <a class="site-brand" href="{{ '/' | relative_url }}" aria-label="{{ site.data.profile.name }}的主页">
      <img src="{{ site.data.profile.school_logo | default: '/assets/img/seu_logo.png' | relative_url }}" alt="{{ site.data.profile.school_logo_alt | default: '东南大学 Southeast University' }}" width="520" height="150">
    </a>
    <div class="site-nav-links">
      {% for item in site.data.navigation %}
      <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
      {% endfor %}
    </div>
  </div>
</nav>
