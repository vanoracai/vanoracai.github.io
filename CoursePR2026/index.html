<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PRML Course Local Preview</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7fb;
      --panel: #ffffff;
      --text: #1f2937;
      --muted: #5b6472;
      --line: #d9dee8;
      --accent: #2563eb;
      --accent-soft: #e8f1ff;
      --code: #f1f5f9;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, "Microsoft YaHei", "PingFang SC", sans-serif;
      line-height: 1.62;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
    }

    aside {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto;
      padding: 22px 18px;
      border-right: 1px solid var(--line);
      background: #ffffff;
    }

    .brand {
      margin-bottom: 22px;
    }

    .brand h1 {
      margin: 0 0 6px;
      font-size: 20px;
      line-height: 1.25;
    }

    .brand p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .lecture-list {
      display: grid;
      gap: 8px;
    }

    button.lecture-button {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      cursor: pointer;
      font: inherit;
      text-align: left;
    }

    button.lecture-button:hover,
    button.lecture-button.active {
      border-color: #9bbcf8;
      background: var(--accent-soft);
      color: #123c86;
    }

    .tools {
      display: flex;
      gap: 8px;
      margin-top: 18px;
    }

    .tools button,
    .tools a {
      flex: 1;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      cursor: pointer;
      font: inherit;
      text-align: center;
      text-decoration: none;
    }

    .tools a[hidden] {
      display: none;
    }

    main {
      min-width: 0;
      padding: 28px;
    }

    .content {
      max-width: 1040px;
      margin: 0 auto;
      padding: 34px 42px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
      box-shadow: 0 10px 30px rgba(31, 41, 55, 0.06);
    }

    .status {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 14px;
    }

    h1, h2, h3, h4 {
      line-height: 1.25;
      scroll-margin-top: 18px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 34px;
    }

    h2 {
      margin-top: 34px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
      font-size: 25px;
    }

    h3 {
      margin-top: 26px;
      font-size: 20px;
    }

    h4 {
      margin-top: 22px;
      font-size: 17px;
    }

    p {
      margin: 12px 0;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 16px auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    blockquote {
      margin: 16px 0;
      padding: 10px 16px;
      border-left: 4px solid #94a3b8;
      background: #f8fafc;
      color: #334155;
    }

    table {
      width: 100%;
      margin: 18px 0;
      border-collapse: collapse;
      font-size: 15px;
    }

    th, td {
      padding: 9px 10px;
      border: 1px solid var(--line);
      vertical-align: top;
    }

    th {
      background: #f1f5f9;
      text-align: left;
    }

    code {
      padding: 0.1em 0.28em;
      border-radius: 4px;
      background: var(--code);
      font-family: Consolas, "SFMono-Regular", monospace;
      font-size: 0.92em;
    }

    pre {
      overflow: auto;
      padding: 14px 16px;
      border-radius: 8px;
      background: #0f172a;
      color: #e2e8f0;
    }

    pre code {
      padding: 0;
      background: transparent;
      color: inherit;
    }

    .math-block {
      overflow-x: auto;
      margin: 16px 0;
      padding: 12px 14px;
      border-radius: 8px;
      background: #fbfdff;
      text-align: center;
    }

    .error {
      padding: 14px 16px;
      border: 1px solid #fecaca;
      border-radius: 8px;
      background: #fff1f2;
      color: #991b1b;
    }

    /* Lecture 1 uses the same heading-driven card rhythm as the reference
       course, while keeping the Markdown itself easy to maintain. */
    .content.lecture-deck {
      max-width: 1180px;
      padding: 0;
      border: 0;
      background: transparent;
      box-shadow: none;
    }

    .lecture-deck .status {
      margin: 0 0 12px;
      padding: 0 4px;
    }

    .lecture-pager {
      position: sticky;
      top: 14px;
      z-index: 20;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto auto;
      gap: 10px;
      align-items: center;
      margin-bottom: 18px;
      padding: 10px 12px;
      border: 1px solid rgba(203, 213, 225, 0.92);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
      backdrop-filter: blur(12px);
    }

    .lecture-pager[hidden] {
      display: none;
    }

    .pager-count {
      min-width: 74px;
      color: #64748b;
      font-size: 13px;
      font-variant-numeric: tabular-nums;
    }

    .pager-title {
      overflow: hidden;
      color: #334155;
      font-size: 14px;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .pager-button {
      width: 38px;
      height: 34px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #fff;
      color: #1e3a8a;
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
      transition: transform 160ms ease, border-color 160ms ease, background 160ms ease;
    }

    .pager-button:hover:not(:disabled) {
      transform: translateY(-1px);
      border-color: #93c5fd;
      background: #eff6ff;
    }

    .pager-button:disabled {
      cursor: default;
      opacity: 0.35;
    }

    .paged-lecture {
      counter-reset: lecture-page;
    }

    .lecture-page {
      counter-increment: lecture-page;
      position: relative;
      overflow: hidden;
      margin: 18px 0;
      padding: clamp(24px, 3vw, 42px) clamp(24px, 4vw, 52px) 46px;
      border: 1px solid #e1e6ec;
      border-radius: 15px;
      background: #fff;
      box-shadow: 0 5px 18px rgba(15, 23, 42, 0.055);
      scroll-margin-top: 82px;
      opacity: 0;
      transform: translateY(18px);
      transition: opacity 480ms ease, transform 480ms cubic-bezier(.2,.7,.2,1), box-shadow 220ms ease;
    }

    .lecture-page.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .lecture-page:hover {
      box-shadow: 0 10px 28px rgba(15, 23, 42, 0.085);
    }

    .lecture-page::after {
      content: counter(lecture-page, decimal-leading-zero);
      position: absolute;
      right: 20px;
      bottom: 14px;
      color: #9aa5b5;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
    }

    .lecture-page > h1:first-child,
    .lecture-page > h2:first-child,
    .lecture-page > h3:first-child {
      margin-top: 0;
      padding-top: 0;
      border-top: 0;
      border-bottom: 1px solid #e5e7eb;
      scroll-margin-top: 94px;
    }

    .lecture-page.level-1 {
      min-height: 190px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      border-color: #d8e3f4;
    }

    .lecture-page.level-1 > h1:first-child {
      max-width: 940px;
      padding-bottom: 18px;
      color: #102a56;
      font-size: clamp(30px, 4vw, 48px);
      letter-spacing: -0.025em;
    }

    .lecture-page.level-2 > h2:first-child {
      padding-bottom: 12px;
      color: #1e3a5f;
      font-size: clamp(24px, 3vw, 34px);
    }

    .lecture-page.level-3 > h3:first-child {
      padding-bottom: 10px;
      color: #243b53;
      font-size: clamp(20px, 2.4vw, 27px);
    }

    .lecture-page > .reveal-item {
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 360ms ease var(--reveal-delay, 80ms),
                  transform 360ms ease var(--reveal-delay, 80ms);
    }

    .lecture-page.is-visible > .reveal-item {
      opacity: 1;
      transform: translateY(0);
    }

    .lecture-page img,
    .lecture-page table {
      transition: transform 200ms ease, box-shadow 200ms ease;
    }

    .lecture-page img:hover {
      transform: scale(1.008);
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.1);
    }

    .lecture-page tbody tr {
      transition: background-color 150ms ease;
    }

    .lecture-page tbody tr:hover {
      background: #f0f7ff;
    }

    @media (max-width: 860px) {
      .app {
        grid-template-columns: 1fr;
      }

      aside {
        position: static;
        height: auto;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      main {
        padding: 16px;
      }

      .content {
        padding: 24px 18px;
      }

      .content.lecture-deck {
        padding: 0;
      }

      .lecture-pager {
        top: 8px;
        grid-template-columns: auto minmax(0, 1fr) auto auto;
      }

      .lecture-page {
        margin: 14px 0;
        padding: 24px 18px 40px;
        scroll-margin-top: 76px;
      }

      .lecture-page.level-1 {
        min-height: 150px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .lecture-page,
      .lecture-page > .reveal-item,
      .pager-button,
      .lecture-page img,
      .lecture-page table {
        opacity: 1;
        transform: none;
        transition: none;
      }
    }
  </style>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      },
      svg: { fontCache: 'global' }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head>
<body>
  <div class="app">
    <aside>
      <div class="brand">
        <h1>PRML Course Preview</h1>
        <p>Local preview for CoursePR2026 markdown lectures.</p>
      </div>
      <div class="lecture-list" id="lectureList"></div>
      <div class="tools">
        <button id="reloadButton" type="button">Reload</button>
        <button id="topButton" type="button">Top</button>
        <a id="packageLink" href="#" download hidden>Package</a>
      </div>
    </aside>
    <main>
      <div class="content">
        <p class="status" id="status">Loading...</p>
        <nav class="lecture-pager" id="lecturePager" aria-label="Lecture page navigation" hidden>
          <span class="pager-count" id="pagerCount">01 / 01</span>
          <span class="pager-title" id="pagerTitle"></span>
          <button class="pager-button" id="previousPage" type="button" aria-label="Previous page">&#8592;</button>
          <button class="pager-button" id="nextPage" type="button" aria-label="Next page">&#8594;</button>
        </nav>
        <article id="article"></article>
      </div>
    </main>
  </div>

  <script>
    const lectures = [
      { file: 'lecture_1.md', title: 'Lecture 1' },
      { file: 'lecture_2.md', title: 'Lecture 2' },
      { file: 'lecture_3.md', title: 'Lecture 3' },
      { file: 'lecture_4.md', title: 'Lecture 4', package: 'lecture_4_with_figures(1).zip' },
      { file: 'lecture_5.md', title: 'Lecture 5', package: 'lecture_5_package.zip' },
      { file: 'lecture_6_7_8.md', title: 'Lectures 6-8', package: 'lecture_6_7_8_package.zip' },
      { file: 'lecture_6.md', title: 'Lecture 6', package: 'lecture_6_package.zip' },
      { file: 'lecture_7.md', title: 'Lecture 7', package: 'lecture_7_package.zip' },
      { file: 'lecture_9.md', title: 'Lecture 9', package: 'lecture_9_package.zip' },
      { file: 'lecture_10.md', title: 'Lecture 10', package: 'lecture_10_package.zip' },
      { file: 'lecture_11.md', title: 'Lecture 11', package: 'lecture_11_package.zip' },
      { file: 'lecture_12.md', title: 'Lecture 12', package: 'lecture_12_with_figures.zip' },
      { file: 'lecture_13.md', title: 'Lecture 13', package: 'lecture_13_package.zip' },
      { file: 'lecture_14.md', title: 'Lecture 14', package: 'lecture_14_package.zip' },
      { file: '内容大纲.md', title: '内容大纲' }
    ];

    const article = document.getElementById('article');
    const statusEl = document.getElementById('status');
    const lectureList = document.getElementById('lectureList');
    const packageLink = document.getElementById('packageLink');
    const contentPanel = document.querySelector('.content');
    const lecturePager = document.getElementById('lecturePager');
    const pagerCount = document.getElementById('pagerCount');
    const pagerTitle = document.getElementById('pagerTitle');
    const previousPage = document.getElementById('previousPage');
    const nextPage = document.getElementById('nextPage');
    let currentFile = new URLSearchParams(location.search).get('file') || 'lecture_1.md';
    let lecturePages = [];
    let activePageIndex = 0;
    let pageObserver = null;

    function escapeHtml(text) {
      return text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function slugify(text) {
      return text
        .toLowerCase()
        .replace(/<[^>]+>/g, '')
        .replace(/[`*_~$\\]/g, '')
        .replace(/[^\p{Letter}\p{Number}]+/gu, '-')
        .replace(/^-+|-+$/g, '');
    }

    function fixPath(path) {
      return path.replace(/^\.\/CoursePR2026\//, './');
    }

    function cacheBustAsset(path) {
      if (!/\.(png|jpg|jpeg|gif|webp|svg)$/i.test(path)) {
        return path;
      }
      const separator = path.includes('?') ? '&' : '?';
      return `${path}${separator}v=${Date.now()}`;
    }

    function inlineMarkdown(text) {
      let output = escapeHtml(text);
      /* Markdown hard breaks are two trailing spaces (or a trailing backslash).
         Preserve them, while ordinary source line wrapping remains a space. */
      output = output.replace(/(?: {2,}|\\)\n/g, '<br>');
      output = output.replace(/\n/g, ' ');
      output = output.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, (_, alt, src) => {
        return `<img src="${cacheBustAsset(fixPath(src))}" alt="${escapeHtml(alt)}">`;
      });
      output = output.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, label, href) => {
        return `<a href="${fixPath(href)}">${label}</a>`;
      });
      output = output.replace(/`([^`]+)`/g, '<code>$1</code>');
      output = output.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      output = output.replace(/\*([^*]+)\*/g, '<em>$1</em>');
      return output;
    }

    function isTableStart(lines, index) {
      return index + 1 < lines.length &&
        /^\s*\|.*\|\s*$/.test(lines[index]) &&
        /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(lines[index + 1]);
    }

    function renderTable(lines) {
      const rows = lines.map(line => line.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(cell => cell.trim()));
      const header = rows[0];
      const body = rows.slice(2);
      const thead = `<thead><tr>${header.map(cell => `<th>${inlineMarkdown(cell)}</th>`).join('')}</tr></thead>`;
      const tbody = `<tbody>${body.map(row => `<tr>${row.map(cell => `<td>${inlineMarkdown(cell)}</td>`).join('')}</tr>`).join('')}</tbody>`;
      return `<table>${thead}${tbody}</table>`;
    }

    function stripFrontMatter(markdown) {
      return markdown.replace(/^---\s*\n[\s\S]*?\n---\s*\n?/, '');
    }

    function renderMarkdown(markdown) {
      const lines = stripFrontMatter(markdown.replace(/\r\n/g, '\n')).split('\n');
      const html = [];
      let paragraph = [];
      let list = [];
      let listType = 'ul';
      let blockquote = [];
      let inCode = false;
      let codeFence = [];
      let inMath = false;
      let mathLines = [];

      function flushParagraph() {
        if (paragraph.length) {
          html.push(`<p>${inlineMarkdown(paragraph.join('\n'))}</p>`);
          paragraph = [];
        }
      }

      function flushList() {
        if (list.length) {
          html.push(`<${listType}>${list.map(item => `<li>${inlineMarkdown(item)}</li>`).join('')}</${listType}>`);
          list = [];
        }
      }

      function flushBlockquote() {
        if (blockquote.length) {
          html.push(`<blockquote>${renderMarkdown(blockquote.join('\n'))}</blockquote>`);
          blockquote = [];
        }
      }

      for (let i = 0; i < lines.length; i += 1) {
        const line = lines[i];

        if (/^```/.test(line)) {
          flushParagraph();
          flushList();
          flushBlockquote();
          if (inCode) {
            html.push(`<pre><code>${escapeHtml(codeFence.join('\n'))}</code></pre>`);
            codeFence = [];
            inCode = false;
          } else {
            inCode = true;
          }
          continue;
        }

        if (inCode) {
          codeFence.push(line);
          continue;
        }

        if (line.trim() === '$$') {
          flushParagraph();
          flushList();
          flushBlockquote();
          if (inMath) {
            html.push(`<div class="math-block">$$${escapeHtml(mathLines.join('\n'))}$$</div>`);
            mathLines = [];
            inMath = false;
          } else {
            inMath = true;
          }
          continue;
        }

        if (inMath) {
          mathLines.push(line);
          continue;
        }

        if (line.trim() === '') {
          flushParagraph();
          flushList();
          flushBlockquote();
          continue;
        }

        if (/^\s*---+\s*$/.test(line)) {
          flushParagraph();
          flushList();
          flushBlockquote();
          html.push('<hr>');
          continue;
        }

        if (/^>\s?/.test(line)) {
          flushParagraph();
          flushList();
          blockquote.push(line.replace(/^>\s?/, ''));
          continue;
        }

        if (isTableStart(lines, i)) {
          flushParagraph();
          flushList();
          flushBlockquote();
          const tableLines = [];
          while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) {
            tableLines.push(lines[i]);
            i += 1;
          }
          i -= 1;
          html.push(renderTable(tableLines));
          continue;
        }

        const heading = /^(#{1,4})\s+(.+)$/.exec(line);
        if (heading) {
          flushParagraph();
          flushList();
          flushBlockquote();
          const level = heading[1].length;
          const content = inlineMarkdown(heading[2]);
          const id = slugify(heading[2]);
          html.push(`<h${level} id="${id}">${content}</h${level}>`);
          continue;
        }

        const item = /^\s*([-*]|\d+\.)\s+(.+)$/.exec(line);
        if (item) {
          flushParagraph();
          flushBlockquote();
          const nextListType = /^\d/.test(item[1]) ? 'ol' : 'ul';
          if (list.length && listType !== nextListType) flushList();
          listType = nextListType;
          list.push(item[2]);
          continue;
        }

        flushList();
        paragraph.push(line.trimStart());
      }

      flushParagraph();
      flushList();
      flushBlockquote();
      return html.join('\n');
    }

    function renderNav() {
      lectureList.innerHTML = lectures.map(lecture => {
        const active = lecture.file === currentFile ? ' active' : '';
        return `<button class="lecture-button${active}" type="button" data-file="${lecture.file}">${lecture.title}</button>`;
      }).join('');
    }

    function updatePackageLink() {
      const lecture = lectures.find(item => item.file === currentFile);
      if (lecture && lecture.package) {
        packageLink.hidden = false;
        packageLink.href = fixPath(lecture.package);
        packageLink.title = `Download ${lecture.package}`;
      } else {
        packageLink.hidden = true;
        packageLink.removeAttribute('href');
        packageLink.removeAttribute('title');
      }
    }

    function updatePager(index) {
      if (!lecturePages.length) return;
      activePageIndex = Math.max(0, Math.min(index, lecturePages.length - 1));
      const page = lecturePages[activePageIndex];
      const heading = page.querySelector('h1, h2, h3');
      pagerCount.textContent = `${String(activePageIndex + 1).padStart(2, '0')} / ${String(lecturePages.length).padStart(2, '0')}`;
      pagerTitle.textContent = heading ? heading.textContent.trim() : 'Lecture overview';
      previousPage.disabled = activePageIndex === 0;
      nextPage.disabled = activePageIndex === lecturePages.length - 1;
    }

    function goToPage(index) {
      const target = lecturePages[Math.max(0, Math.min(index, lecturePages.length - 1))];
      if (!target) return;
      target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function clearLectureDeck() {
      if (pageObserver) {
        pageObserver.disconnect();
        pageObserver = null;
      }
      lecturePages = [];
      activePageIndex = 0;
      article.classList.remove('paged-lecture');
      contentPanel.classList.remove('lecture-deck');
      lecturePager.hidden = true;
    }

    function enhanceLectureOne() {
      const nodes = Array.from(article.childNodes);
      const fragment = document.createDocumentFragment();
      const units = [];
      const maxPageScore = 3600;
      const maxTitlePageScore = 3800;
      let unit = null;
      let page = null;
      let pageScore = 0;
      let pageLevels = [];

      function startPage(level = 3) {
        page = document.createElement('section');
        page.className = `lecture-page level-${level}`;
        fragment.appendChild(page);
        pageScore = 0;
        pageLevels = [];
        return page;
      }

      function finishUnit() {
        if (unit && unit.nodes.length) units.push(unit);
        unit = null;
      }

      function scoreUnit(sectionUnit) {
        let score = 0;
        sectionUnit.nodes.forEach(node => {
          if (node.nodeType === Node.TEXT_NODE) {
            score += node.textContent.trim().length;
            return;
          }
          if (node.nodeType !== Node.ELEMENT_NODE) return;
          score += (node.textContent || '').trim().length;
          score += node.querySelectorAll('img').length * 1400;
          score += node.querySelectorAll('.math-block').length * 260;
          score += node.querySelectorAll('pre').length * 500;
          score += node.querySelectorAll('table tr').length * 190;
        });
        return score;
      }

      nodes.forEach(node => {
        const isHeading = node.nodeType === Node.ELEMENT_NODE && /^(H1|H2|H3)$/.test(node.tagName);
        const isDivider = node.nodeType === Node.ELEMENT_NODE && node.tagName === 'HR';

        if (isHeading) {
          finishUnit();
          const level = Number(node.tagName.slice(1));
          unit = { level, nodes: [node] };
        } else if (isDivider) {
          finishUnit();
          units.push({ divider: true, nodes: [] });
        } else if (node.nodeType === Node.TEXT_NODE && !node.textContent.trim()) {
          return;
        } else {
          if (!unit) unit = { level: 3, nodes: [] };
          unit.nodes.push(node);
        }
      });
      finishUnit();

      units.forEach(sectionUnit => {
        if (sectionUnit.divider) {
          page = null;
          pageScore = 0;
          pageLevels = [];
          return;
        }

        const unitScore = scoreUnit(sectionUnit);
        const canJoinTitlePage = page &&
          sectionUnit.level === 2 &&
          pageLevels.length === 1 &&
          pageLevels[0] === 1 &&
          pageScore + unitScore <= maxTitlePageScore;

        if (sectionUnit.level === 1) {
          startPage(1);
        } else if (sectionUnit.level === 2 && !canJoinTitlePage) {
          startPage(2);
        } else if (sectionUnit.level === 3 && (!page || pageScore + unitScore > maxPageScore)) {
          startPage(3);
        } else if (!page) {
          startPage(sectionUnit.level);
        }

        sectionUnit.nodes.forEach(node => page.appendChild(node));
        pageScore += unitScore;
        pageLevels.push(sectionUnit.level);
      });

      article.replaceChildren(fragment);
      article.classList.add('paged-lecture');
      contentPanel.classList.add('lecture-deck');
      lecturePager.hidden = false;
      lecturePages = Array.from(article.querySelectorAll('.lecture-page'));

      lecturePages.forEach((lecturePage, pageIndex) => {
        lecturePage.dataset.page = String(pageIndex + 1);
        const heading = lecturePage.querySelector(':scope > h1, :scope > h2, :scope > h3');
        if (heading && heading.id) {
          lecturePage.id = `page-${heading.id}`;
        }

        Array.from(lecturePage.children).forEach((child, childIndex) => {
          if (!/^H[1-3]$/.test(child.tagName)) {
            child.classList.add('reveal-item');
            child.style.setProperty('--reveal-delay', `${Math.min(70 + childIndex * 45, 360)}ms`);
          }
        });
      });

      pageObserver = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (!entry.isIntersecting) return;
          entry.target.classList.add('is-visible');
          const index = lecturePages.indexOf(entry.target);
          if (index >= 0 && entry.intersectionRatio >= 0.2) updatePager(index);
        });
      }, { rootMargin: '-12% 0px -48% 0px', threshold: [0.08, 0.2, 0.45] });

      lecturePages.forEach(lecturePage => pageObserver.observe(lecturePage));
      if (lecturePages[0]) lecturePages[0].classList.add('is-visible');
      updatePager(0);
    }

    async function loadLecture(file) {
      currentFile = file;
      clearLectureDeck();
      renderNav();
      updatePackageLink();
      statusEl.textContent = `Loading ${file}...`;
      article.innerHTML = '';

      try {
        const response = await fetch(`${file}?t=${Date.now()}`);
        if (!response.ok) {
          throw new Error(`${response.status} ${response.statusText}`);
        }
        const markdown = await response.text();
        article.innerHTML = renderMarkdown(markdown);
        if (file === 'lecture_1.md') {
          enhanceLectureOne();
        }
        statusEl.textContent = `Showing ${file}. Edit the markdown, then click Reload.`;
        history.replaceState(null, '', `?file=${encodeURIComponent(file)}`);
        if (window.MathJax && window.MathJax.typesetPromise) {
          window.MathJax.typesetPromise([article]);
        }
      } catch (error) {
        statusEl.textContent = '';
        article.innerHTML = `<div class="error">Cannot load ${escapeHtml(file)}. Start a local server in this folder, then open http://127.0.0.1:8000/. Details: ${escapeHtml(error.message)}</div>`;
      }
    }

    lectureList.addEventListener('click', event => {
      const button = event.target.closest('button[data-file]');
      if (button) {
        loadLecture(button.dataset.file);
      }
    });

    document.getElementById('reloadButton').addEventListener('click', () => loadLecture(currentFile));
    document.getElementById('topButton').addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
    previousPage.addEventListener('click', () => goToPage(activePageIndex - 1));
    nextPage.addEventListener('click', () => goToPage(activePageIndex + 1));
    document.addEventListener('keydown', event => {
      if (currentFile !== 'lecture_1.md' || !event.altKey) return;
      if (event.key === 'ArrowLeft') goToPage(activePageIndex - 1);
      if (event.key === 'ArrowRight') goToPage(activePageIndex + 1);
    });

    renderNav();
    loadLecture(currentFile);
  </script>
</body>
</html>
