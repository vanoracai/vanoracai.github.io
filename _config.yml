# Personal information is maintained in _data/profile.json.
lang: zh-CN

# Search Engine Optimization (SEO)
canonical: https://vanoracai.github.io/
url: https://vanoracai.github.io
baseurl: ""

# The option is used to enable the Johns Hopkins template.
enable_hopkins_logo: true

# The option is used to show the last update time.
enable_last_update: true

# Images 
favicon: /assets/img/whale-favicon-v2.png
favicon_dark: /assets/img/whale-favicon-v2.png

# The following files will be removed from the generated website.
exclude:
  - .venv
  - scripts
  - requirements.txt
  - generate.ps1
  - compile_cv.ps1
  - bibliography_common.py
  - bib_to_html.py
  - bib_to_latex.py
  - fill_bib_url.py
  - citations.bib
  - pdfs/paper_pdf_manifest.csv
  - publications-guide.md
  - tests
  - reference-wangywust
  - vendor
  - Gemfile
  - Gemfile.lock
  - node_modules
  - CLAUDE.md
  - AGENTS.md
  - README.md
  - 主页更新指南.md
  - LICENSE
  - CNAME
  - CoursePR2026/Python
  - CoursePR2026/lecture_4_with_figures(1).zip
  - CoursePR2026/lecture_5_package.zip
  - CoursePR2026/lecture_6_package.zip
