name: Generate, build and deploy site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install content dependencies
        run: python -m pip install -r requirements.txt
      - name: Test metadata pipeline
        run: python -m unittest discover -s tests
      - name: Install Tectonic 0.17.0
        shell: bash
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/tectonic.tar.gz" \
            https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.17.0/tectonic-0.17.0-x86_64-unknown-linux-musl.tar.gz
          echo "8533d07f9ccbd7a65824b9e0459041bca34af1eb33daba48f59215593753a3b7  $RUNNER_TEMP/tectonic.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/tectonic-bin"
          tar -xzf "$RUNNER_TEMP/tectonic.tar.gz" -C "$RUNNER_TEMP/tectonic-bin"
          echo "$RUNNER_TEMP/tectonic-bin" >> "$GITHUB_PATH"
      - name: Cache TeX packages and fonts
        uses: actions/cache@v4
        with:
          path: .venv/tectonic-cache
          key: tectonic-0.17.0-${{ runner.os }}-${{ hashFiles('scripts/compile_cv.py', 'Latex/**/*.tex') }}
          restore-keys: tectonic-0.17.0-${{ runner.os }}-
      - name: Generate content and compile both CV PDFs
        run: python scripts/generate_all.py
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: Build Jekyll
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build
      - name: Validate generated site
        run: python scripts/check_site.py
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
